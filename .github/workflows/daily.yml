name: daily
on:
  schedule:
    - cron: "35 21 * * 1-5"   # 日本時間 6:35（火〜土）
    - cron: "35 22 * * 1-5"   # 予備：日本時間 7:35
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: calc
        run: python3 market_check.py
      - name: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.txt latest.json history.csv
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
